<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Wing 2.0 Legacy — Points & Balance Reference</title>
  <meta name="description" content="Official human-readable points and balance reference for Star Wars: X-Wing Miniatures Game (Second Edition / 2.0 Legacy), generated from xwing-data2-legacy repository with full retrospective history, ship and upgrade fonts, and commit interlinks.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://infinitearenas.com/xw2/images/shipicons/rebel/t65xwing.png">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand-section">
        <span class="brand-logo-glyph" title="X-Wing">x</span>
        <div>
          <h1 class="brand-title">X-Wing 2.0 Legacy Points</h1>
          <p class="brand-subtitle">Interactive Points Document & Balance Retrospect</p>
        </div>
      </div>
      <div class="header-badges">
        <a id="releaseBadge" class="badge badge-version" href="https://github.com/SogeMoge/xwing-data2-legacy/releases" target="_blank" rel="noopener noreferrer">Release 3.12.0</a>
        <a id="commitBadge" class="badge badge-commit" href="https://github.com/SogeMoge/xwing-data2-legacy" target="_blank" rel="noopener noreferrer">commit</a>
        <a class="badge badge-link" href="https://github.com/SogeMoge/xwing-data2-legacy" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          <span>Repository</span>
        </a>
        <a class="badge badge-link" href="https://docs.google.com/spreadsheets/d/1kgEwq-1UtA7w8Q5sXAr_bt0AZHfaaZDnVRC9lnyAoBY" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Google Sheet</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Faction & Category Navigation Tabs -->
  <nav class="tabs-nav" id="tabsNav">
    <!-- Populated by app.js -->
  </nav>

  <!-- Main Content -->
  <main class="app-main">
    
    <!-- Controls Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search cards, chassis, keywords, text..." autocomplete="off">
        </div>

        <select id="formatSelect" class="select-filter">
          <option value="all">All Formats</option>
          <option value="standard">Standard</option>
          <option value="wildspace">Wild Space</option>
          <option value="epic">Epic</option>
        </select>

        <select id="changeSelect" class="select-filter">
          <option value="all">All Cards</option>
          <option value="changed">Only Changed Cards</option>
          <option value="buffs">Points Buffs (Cheaper)</option>
          <option value="nerfs">Points Nerfs (Costlier)</option>
          <option value="params">Parameter Changes (Format/Kw/Slots)</option>
        </select>

        <select id="typeSelect" class="select-filter">
          <option value="all">All Chassis / Types</option>
        </select>
      </div>

      <div class="toolbar-right">
        <button id="toggleHeadersBtn" class="btn btn-secondary" title="Toggle chassis and slot group headers to display more rows at once">
          <span>🏷️ Show Headers</span>
        </button>
        <button id="toggleHistoryBtn" class="btn btn-secondary" title="Show all historical points columns side-by-side like the Google Spreadsheet">
          <span>📜 Show History</span>
        </button>
        <button id="exportBtn" class="btn btn-secondary" title="Export visible table to CSV">
          <span>📥 Export CSV</span>
        </button>
      </div>
    </div>

    <!-- Summary Stats -->
    <div class="stats-banner">
      <span id="rowCount">Loading cards...</span>
      <span style="font-size: 0.78rem; color: var(--text-dim);">
        Click any card row to view card art, stats, dial, and full historical timeline.
      </span>
    </div>

    <!-- Data Table Container -->
    <div class="table-wrapper">
      <table class="data-table" id="dataTable">
        <thead id="tableHead">
          <!-- Populated by app.js -->
        </thead>
        <tbody id="tableBody">
          <!-- Populated by app.js -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- Card Detail Modal / Drawer -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="drawer">
      <div class="drawer-header">
        <div class="drawer-title-box">
          <h2 class="drawer-title" id="drawerTitle">Card Details</h2>
        </div>
        <button class="drawer-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="drawer-body" id="drawerContent">
        <!-- Populated on click -->
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
